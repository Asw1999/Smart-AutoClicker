name: 'Dev Build'

on:
  push:
    branches: [ master, dev, 'feature/**' ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build fDroid Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Debug APK
        run: ./gradlew assembleFDroidDebug
        env:
          JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: klickr-debug-arm64-v8a-${{ github.sha }}
          path: smartautoclicker/build/outputs/apk/fDroid/debug/*arm64-v8a*.apk
          retention-days: 14
